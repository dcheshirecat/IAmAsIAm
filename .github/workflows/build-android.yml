# Builds a sideloadable Android APK (Actions > Build Android > Run workflow).
# Copied from Seven Witches (same disk/swap/memory fixes). One-time setup: add the repo secrets
# UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (the same values as Seven Witches; see
# https://game.ci/docs/github/activation). Download the APK from the run's Artifacts.
# The build runs IAmAsIAm.EditorTools.BuildTools.BuildAndroid: validate data, compile the Ink
# story, configure URP/Android, generate the Boot scene, build.
#
# Updates install over the old app (no uninstall, saves kept) because every build has a higher version code
# (the run number) and is signed with the same key, from the repo secrets ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASS. Without them it still builds, but with a throwaway key, and the summary says so.
name: Build Android
on:
  push:
    branches: [main]
    # Docs, drafts and tools don't change the app, so pushing only those doesn't start a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Assets/_Project/Story/Drafts/**'
      - 'tools/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:
# No queue (owner): every push gets its own build, and builds run side by side. None is ever cancelled.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Fails in seconds (not after a long build) if a secret is missing. Values are never printed.
      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "### Missing repo secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Add them in Settings > Secrets and variables > Actions (same values as Seven Witches)." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing repo secrets:$missing"
            exit 1
          fi
          echo "All three Unity secrets are set."
      - name: Check signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASS" ]; then
            echo "Signing key found: this APK installs over the previous one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No signing key yet" >> "$GITHUB_STEP_SUMMARY"
            echo "This APK uses a throwaway key, so it won't install over an older one (uninstall first)." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::No signing key secrets: updates will need an uninstall."
          fi
      # The Unity Android image is larger than the runner's free disk; remove unused preinstalled tools.
      # This used to take ~6.5 minutes one folder at a time. Now every folder is deleted at the same time,
      # in the background, while the code and the cache download; "Add swap space" waits for it to finish.
      - name: Free disk space (starts in the background)
        run: |
          df -h /
          cat > /tmp/cleanup.sh <<'EOF2'
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                   /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
                   /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
                   /opt/microsoft /opt/google /opt/az /usr/lib/jvm /usr/share/miniconda; do
            sudo rm -rf "$d" &
          done
          sudo docker image prune --all --force > /dev/null &
          sudo apt-get clean &
          wait
          touch /tmp/cleanup.done
          EOF2
          nohup bash /tmp/cleanup.sh > /tmp/cleanup.log 2>&1 &
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-
      # Unity's Android (IL2CPP) build can need more memory than the runner's ~7 GB; without extra swap
      # the build gets killed (exit code 137). The swap file goes on whichever disk has room (the main
      # disk, after the cleanup above; /mnt is small on newer runners), and the step fails loudly if
      # no swap ends up active, rather than letting the build run without it.
      - name: Add swap space
        run: |
          echo "Waiting for the disk cleanup..."
          while [ ! -f /tmp/cleanup.done ]; do sleep 2; done
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          df -h / /mnt
          for f in /swapfile /mnt/swapfile; do
            dir=$(dirname $f)
            free_gb=$(df --output=avail -BG "$dir" | tail -1 | tr -dc '0-9')
            if [ "$free_gb" -ge 20 ]; then
              sudo fallocate -l 14G $f && sudo chmod 600 $f && sudo mkswap $f && sudo swapon $f && break
            fi
          done
          free -h
          swapon --show
          test "$(swapon --show --noheadings | wc -l)" -gt 0
      # Every 20 seconds: host RAM/swap, the Unity container's own memory against its limit, and any
      # process the kernel killed for lack of memory. Shown on the run's Summary page at the end.
      - name: Start memory log
        run: |
          cat > /tmp/memlog.sh <<'EOF'
          while true; do
            host=$(free -m | awk '/Mem:/{printf "ram %s/%s MB  ", $3, $2} /Swap:/{printf "swap %s/%s MB", $3, $2}')
            box=$(docker stats --no-stream --format '{{.MemUsage}}' 2>/dev/null | head -1)
            echo "$(date +%T)  $host  ${box:+ unity container $box}"
            sudo dmesg | grep -iE "killed process|out of memory" | tail -n 1 | sed 's/^/    KERNEL: /'
            sleep 20
          done
          EOF
          nohup bash /tmp/memlog.sh > /tmp/memory.log 2>&1 &
      # Some builds have been killed (exit 137) a few seconds after Unity starts, while loading the cached
      # Library, with plenty of memory free (no out-of-memory kill). It's intermittent and a killed try fails
      # in ~2 minutes, so the build runs with the cache, then up to twice more from a clean checkout and Library.
      - name: Build
        id: build
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage   # .apk
          buildMethod: IAmAsIAm.EditorTools.BuildTools.BuildAndroid
          # Higher every build, so Android treats it as an update.
          androidVersionCode: ${{ github.run_number }}
          # The same key every build. Empty secrets = a debug key.
          androidKeystoreName: iamasiam.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: iamasiam
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          # Unity runs in a Docker container capped by default at 95% of the runner's RAM, so it could
          # never reach the swap above and got killed (exit code 137). Allow RAM + most of the swap.
          dockerMemoryLimit: 18g
      - name: Clean up after a failed try (only if the first try failed)
        if: steps.build.outcome == 'failure'
        run: |
          echo "The first build try failed; trying again from a clean checkout and Library." >> "$GITHUB_STEP_SUMMARY"
          # A failed try leaves files behind (root-owned, from Unity's container), and the build tool refuses
          # to start on a folder with changes ("Branch is dirty"). Put the checkout back exactly as committed.
          sudo chown -R "$(id -u):$(id -g)" .
          git checkout -- .
          git clean -fdq
          rm -rf Library build
      - name: Build again from a clean Library (only if the first try failed)
        id: retry
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage   # .apk
          buildMethod: IAmAsIAm.EditorTools.BuildTools.BuildAndroid
          # Higher every build, so Android treats it as an update.
          androidVersionCode: ${{ github.run_number }}
          # The same key every build. Empty secrets = a debug key.
          androidKeystoreName: iamasiam.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: iamasiam
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          # Unity runs in a Docker container capped by default at 95% of the runner's RAM, so it could
          # never reach the swap above and got killed (exit code 137). Allow RAM + most of the swap.
          dockerMemoryLimit: 18g
      - name: Clean up after a failed try (only if the second try failed too)
        if: steps.build.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: |
          echo "The second try failed too; one last try." >> "$GITHUB_STEP_SUMMARY"
          # A failed try leaves files behind (root-owned, from Unity's container), and the build tool refuses
          # to start on a folder with changes ("Branch is dirty"). Put the checkout back exactly as committed.
          sudo chown -R "$(id -u):$(id -g)" .
          git checkout -- .
          git clean -fdq
          rm -rf Library build
      - name: Build a third time (only if both tries failed)
        id: retry2
        if: steps.build.outcome == 'failure' && steps.retry.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage   # .apk
          buildMethod: IAmAsIAm.EditorTools.BuildTools.BuildAndroid
          # Higher every build, so Android treats it as an update.
          androidVersionCode: ${{ github.run_number }}
          # The same key every build. Empty secrets = a debug key.
          androidKeystoreName: iamasiam.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: iamasiam
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          # Unity runs in a Docker container capped by default at 95% of the runner's RAM, so it could
          # never reach the swap above and got killed (exit code 137). Allow RAM + most of the swap.
          dockerMemoryLimit: 18g
      - name: Stop if every try failed
        if: steps.build.outcome == 'failure' && steps.retry.outcome != 'success' && steps.retry2.outcome != 'success'
        run: |
          echo "### Every build try failed" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # What the build set as the app icon (BuildTools.ApplyAppIcon writes it), on the Summary page.
      - name: App icon report
        if: always()
        run: |
          {
            echo "## App icon"
            echo '```'
            cat build/icon_report.txt 2>/dev/null || echo "No icon report (the build didn't get that far)."
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Puts the findings on the run's Summary page (easy to read on a phone), pass or fail.
      - name: Memory log
        if: always()
        run: |
          {
            echo "## Memory during the build"
            echo '```'
            nproc | sed 's/^/CPUs: /'
            free -h
            swapon --show
            echo
            echo "Kernel out-of-memory kills:"
            sudo dmesg | grep -iE "killed process|out of memory" | tail -n 5 || true
            echo
            echo "Last 40 readings (every 20 s):"
            grep -v KERNEL /tmp/memory.log | tail -n 40 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: IAmAsIAm-apk-${{ github.run_number }}
          path: build/Android
